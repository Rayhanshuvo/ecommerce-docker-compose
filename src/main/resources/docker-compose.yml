services:
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: app
      MYSQL_PASSWORD: app123
      MYSQL_DATABASE: ecommerce
    command: --bind-address=0.0.0.0

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: mysql-db
    depends_on:
      - mysql-db